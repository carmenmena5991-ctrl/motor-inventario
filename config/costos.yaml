# Configuración de Costos de Negocio para el Motor de Reposición
costos:
  quiebre_stock: 5.0   # Penalización económica por venta perdida (unidad no disponible)
  merma: 2.0           # Penalización económica por exceso de inventario / vencimiento

parametros_pedido:
  horizonte_dias: 7    # Días a pronosticar hacia adelante
  cuantil_objetivo: 0.90 # Cuantil base para cubrir incertidumbre (p90)
  factor_seguridad_default: 0.15

# Métricas de seguimiento
evaluacion:
  dias_historicos_comparar: 14
